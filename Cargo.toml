[package]
name = "claude-code-agent"
version = "0.7.0"
rust-version = "1.88"
edition = "2024"
description = "Rust SDK for Claude Code — persistent subprocess, hook callbacks, in-process tools, record/replay"
license = "MIT"
repository = "https://github.com/nguyenvanduocit/claude-code-agent"
readme = "README.md"
keywords = ["claude", "claude-code", "anthropic", "agent", "sdk"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "examples/**", "tests/**", "README.md", "LICENSE"]

[workspace]
members = ["claude-code-agent-macros"]

[features]
default = []
macros  = ["dep:claude-code-agent-macros"]

[dependencies]
tokio        = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "fs", "macros"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
tracing      = "0.1"
dashmap      = "6"

claude-code-agent-macros      = { version = "0.7.0", path = "claude-code-agent-macros", optional = true }

tokio-stream = "0.1.19"
async-stream = "0.3.6"
uuid = { version = "1", features = ["v4"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode-perl"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32.0", features = ["signal"] }

[dev-dependencies]
tokio             = { version = "1", features = ["full"] }
anyhow            = "1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
claude-code-agent-macros = { version = "0.7.0", path = "claude-code-agent-macros" }

[[example]]
name = "tools"
required-features = ["macros"]

# Runs its own executable as a fake CLI, so it needs its own `main`.
[[test]]
name = "process_tree"
harness = false
