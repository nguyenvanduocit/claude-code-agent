name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks before publishing.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features
      # Live-CLI tests are #[ignore]d; these run without credentials.
      # tests/fake_cli.rs drives a fake CLI: process cleanup, cancel and timeout paths.
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features

  # The lockfile must build on the declared rust-version (Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-features --all-targets
