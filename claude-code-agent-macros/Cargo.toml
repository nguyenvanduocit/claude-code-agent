[package]
name = "claude-code-agent-macros"
version = "0.6.1"
edition = "2024"
description = "Proc macros for claude-code-agent — #[claude_tool] generates ToolDef from async fn signatures"
license = "MIT"
repository = "https://github.com/nguyenvanduocit/claude-sdk-rs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full"] }

