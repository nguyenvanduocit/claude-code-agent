[package]
name = "claude-sdk-macros"
version = "0.5.0"
edition = "2024"
description = "Proc macros for claude-sdk — #[claude_tool] generates ToolDef from async fn signatures"
license = "MIT"
repository = "https://github.com/nguyenvanduocit/claude-sdk-rs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full"] }

