[package]
name = "claude-sdk-macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for claude-sdk — #[claude_tool] generates ToolDef from async fn signatures"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full"] }
